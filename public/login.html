<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Queue - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(1, 61, 129, 0.25), rgba(7, 112, 233, 0.25)), url('./res/Philippine-Statistics-Authority-PSA.png') center / cover fixed; color: #1f2a3a; }
        .layout-wrapper { display: flex; width: 100%; height: 100vh; padding: 40px 60px; position: relative; }
        .brand-section { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
        .brand-title { color: #1a428a; font-size: 6.5rem; font-weight: 900; line-height: 0.95; letter-spacing: -3px; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(255,255,255,0.2); }
        .brand-subtitle { color: #ffffff; font-size: 2.2rem; font-weight: 400; letter-spacing: -0.5px; }
        .footer-info { position: absolute; bottom: 30px; left: 60px; width: calc(100% - 120px); z-index: 2; }
        .footer-info hr { border: none; border-top: 2px solid rgba(50, 50, 50, 0.6); margin-bottom: 15px; }
        .footer-info p { color: #ffffff; font-size: 1.05rem; max-width: 800px; line-height: 1.4; }
        .login-section { flex: 1; display: flex; align-items: center; justify-content: flex-end; z-index: 2; padding-right: 40px; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 50px 40px; border-radius: 25px; border: 2px solid #111; box-shadow: 0 25px 50px rgba(0,0,0,0.15); text-align: center; }
        .login-card h2 { color: #222; font-weight: 300; font-size: 2.2rem; margin-bottom: 40px; letter-spacing: -1px; }
        .input-group { margin-bottom: 20px; text-align: center; }
        .input-group input, .input-group select { width: 100%; padding: 16px 24px; border: 2px solid #888; border-radius: 50px; font-size: 1rem; font-family: inherit; transition: 0.3s; background: white; }
        .input-group input:focus, .input-group select:focus { border-color: #3399aa; outline: none; }
        .forgot-link { display: block; font-size: 0.75rem; color: #666; text-decoration: none; margin-top: -10px; margin-bottom: 30px; }
        .btn-login { width: 70%; padding: 14px; background: #369baf; color: #ffffff; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; margin: 0 auto; display: block; }
        .btn-login:hover { background: #2a7a8a; transform: translateY(-2px); }
        .status-msg { color: #dc3545; font-size: 0.9rem; margin-top: 15px; font-weight: 700; min-height: 20px; }
        .toggle-text { margin-top: 25px; font-size: 0.85rem; color: #888; }
        .toggle-text a { color: #369baf; font-weight: 600; text-decoration: none; cursor: pointer; }
        #signupForm { display: none; }
        @media (max-width: 768px) { .layout-wrapper { flex-direction: column; padding: 20px; } .login-section { justify-content: center; padding-right: 0; margin-top: 40px; } .brand-section, .footer-info { text-align: center; left: 0; width: 100%; position: relative; } }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <div class="brand-section">
            <h1 class="brand-title">Philippine<br>Statistics<br>Authority</h1>
            <h2 class="brand-subtitle">Queueing System</h2>
        </div>
        <div class="login-section">
            <div class="login-card">
                <div id="loginForm">
                    <h2>Login</h2>
                    <div class="input-group"><input type="email" id="loginEmail" required placeholder="Username (Email)"></div>
                    <div class="input-group"><input type="password" id="loginPass" required placeholder="Password"></div>
                    <a href="#" id="linkForgot" class="forgot-link">Forgot Password?</a>
                    <button id="btnLogin" class="btn-login">Login</button>
                    <div id="loginStatus" class="status-msg"></div>
                    <div class="toggle-text"><a id="linkToSignup">System Registration</a></div>
                </div>
                <div id="signupForm">
                    <h2>register</h2>
                    <div class="input-group"><input type="email" id="signEmail" required placeholder="Email Address"></div>
                    <div class="input-group"><input type="password" id="signPass" required placeholder="Password (Min 6 chars)"></div>
                    <div class="input-group">
                        <select id="signRole" required>
                            <option value="controller">Queue Staff</option>
                            <option value="admin">System Admin</option>
                        </select>
                    </div>
                    <button id="btnSignup" class="btn-login" style="background:#1a428a;">Create Account</button>
                    <div id="signupStatus" class="status-msg"></div>
                    <div class="toggle-text"><a id="linkToLogin">Back to Login</a></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-info">
        <hr>
        <p>We provide statistics, civil registration, and identification services for sustainable, innovative, and inclusive development.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv0Bnx7ESj_roRTB137vWJ7KLTDXR1C8Y",
            authDomain: "queue-project-login.firebaseapp.com",
            projectId: "queue-project-login",
            storageBucket: "queue-project-login.firebasestorage.app",
            messagingSenderId: "869956656004",
            appId: "1:869956656004:web:3d2a98bea880c701605bd1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- AUTHENTICATION LOGGER HELPER ---
        async function logAuthActivity(action, email) {
            try {
                await fetch('/api/log-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action, email: email })
                });
            } catch (error) {
                console.error("Could not record log:", error);
            }
        }

        document.getElementById('linkToSignup').addEventListener('click', (e) => {
            e.preventDefault(); document.getElementById('loginForm').style.display = 'none'; document.getElementById('signupForm').style.display = 'block'; document.getElementById('loginStatus').innerText = '';
        });
        document.getElementById('linkToLogin').addEventListener('click', (e) => {
            e.preventDefault(); document.getElementById('signupForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; document.getElementById('signupStatus').innerText = '';
        });

        document.getElementById('btnSignup').addEventListener('click', () => {
            const email = document.getElementById('signEmail').value;
            const pass = document.getElementById('signPass').value;
            const role = document.getElementById('signRole').value;
            const status = document.getElementById('signupStatus');
            if (!email || !pass) return status.innerText = "Please fill in all fields.";

            createUserWithEmailAndPassword(auth, email, pass).then(async () => {
                await fetch('/api/set-role', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, role }) });
                
                // --> LOG REGISTRATION
                await logAuthActivity('NEW_REGISTRATION', email);
                
                alert(`${role.toUpperCase()} account created successfully! You can now log in.`);
                document.getElementById('linkToLogin').click(); 
            }).catch((error) => status.innerText = error.message.replace("Firebase: ", ""));
        });

        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const status = document.getElementById('loginStatus');
            if (!email || !pass) return status.innerText = "Please fill in all fields.";

            signInWithEmailAndPassword(auth, email, pass).then(async (userCredential) => {
                const userEmail = userCredential.user.email;
                const response = await fetch('/api/get-role', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: userEmail }) });
                const data = await response.json();

                if (data.role === 'banned') {
                    signOut(auth);
                    return status.innerText = "This account has been removed by an Admin.";
                }

                // --> LOG SUCCESSFUL LOGIN
                await logAuthActivity('USER_LOGIN', userEmail);

                localStorage.setItem('psa_admin_token', userEmail);
                localStorage.setItem('psa_role', data.role);
                window.location.href = data.role === 'admin' ? "admin_dashboard.html" : "queue-control.html"; 
            }).catch(() => status.innerText = "Invalid email or password.");
        });

        document.getElementById('linkForgot').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            if (!email) return document.getElementById('loginStatus').innerText = "Type your email first.";
            sendPasswordResetEmail(auth, email).then(() => alert("Password reset email sent!")).catch(() => document.getElementById('loginStatus').innerText = "Error sending reset email.");
        });
    </script>
</body>
</html>
