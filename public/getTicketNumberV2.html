<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=yes">
    <title>PSA Kiosk - Ticket Selection</title>
    <link rel="icon" type="image/png" href="./res/PSA.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root { 
            --bg-glass: rgba(25, 35, 60, 0.459); 
            --border-glass: rgba(255, 255, 255, 0.25); 
            --radius-lg: 35px; 
            --radius-md: 20px; 
            --text-light: #f8f9fa; 
        }

        * {
            box-sizing: border-box;
        }

        body {  
            min-height: 100vh; 
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;  
            display: flex;  
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            background: linear-gradient(135deg, rgba(10, 25, 60, 0.85), rgba(15, 45, 90, 0.85)), url('./res/PSA-BG.png') center/cover fixed;  
            background-blend-mode: overlay; 
            color: var(--text-light);
            margin: 0;
        }

        /* Glassmorphism Main Container */
        .main-container-card { 
            border-radius: var(--radius-lg) !important; 
            background: var(--bg-glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid var(--border-glass);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); 
            overflow: hidden; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Responsive card body padding */
        .card-body.p-5 {
            padding: 2rem !important;
        }

        /* Responsive logo */
        .psa-logo {
            max-width: 100%;
            height: auto;
            width: clamp(80px, 25vw, 160px);
            margin-bottom: 1rem;
        }

        /* Responsive headings */
        h1.font-weight-bold {
            font-size: clamp(1.6rem, 6vw, 2.8rem);
            word-break: break-word;
        }

        .lead {
            font-size: clamp(1rem, 4vw, 1.25rem);
        }

        /* Service Cards */
        .service-card { 
            padding: 1.5rem; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            border-radius: var(--radius-md) !important; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            height: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.15);  
            color: var(--text-light); 
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.02);
        }

        .service-card:hover { 
            transform: translateY(-5px); 
            background: rgba(255, 255, 255, 0.15); 
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.1) !important; 
            border-color: rgba(255, 255, 255, 0.5); 
        }

        .service-card i {
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 0.75rem;
        }

        .service-card h4 {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }

        .service-card p {
            font-size: clamp(0.75rem, 3vw, 0.9rem);
        }

        /* Icon colors */
        .icon-national { color: #64b5f6; }
        .icon-civil { color: #81c784; }

        /* Responsive row layout – already handled by Bootstrap col-md-5, but ensure on small screens it's full width */
        @media (max-width: 767px) {
            .col-md-5 {
                flex: 0 0 100%;
                max-width: 100%;
            }
            .card-body.p-5 {
                padding: 1.5rem !important;
            }
            body {
                padding: 10px;
            }
        }

        /* Tablet adjustments */
        @media (min-width: 768px) and (max-width: 1024px) {
            .col-md-5 {
                flex: 0 0 45%;
                max-width: 45%;
            }
            .card-body.p-5 {
                padding: 2rem !important;
            }
        }

        /* Overlays & Popups – responsive */
        .popup-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
            padding: 16px; 
        }

        .popup-box { 
            width: 100%; 
            max-width: 500px; 
            background: var(--bg-glass); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--border-glass); 
            border-radius: var(--radius-lg) !important; 
            overflow: hidden; 
            padding: 1.5rem !important; 
            color: var(--text-light); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin: 16px;
        }

        @media (max-width: 480px) {
            .popup-box {
                padding: 1.25rem !important;
                max-width: 95%;
            }
            .popup-box h2 {
                font-size: 1.5rem;
            }
        }

        /* Large Buttons – responsive touch targets */
        .btn-xl { 
            padding: 0.9rem 1rem; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: var(--radius-md) !important; 
            transition: all 0.2s ease; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: #fff;
            min-height: 56px;
        }

        @media (min-width: 768px) {
            .btn-xl {
                padding: 1.2rem;
                font-size: 1.25rem;
            }
        }

        .btn-primary.btn-xl { 
            background: linear-gradient(135deg, #0056b3, #0033a0); 
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.4); 
        }
        .btn-primary.btn-xl:hover { 
            background: linear-gradient(135deg, #0069d9, #0044cc); 
            transform: translateY(-2px); 
            border-color: rgba(255, 255, 255, 0.5); 
        }
        .btn-success.btn-xl { 
            background: linear-gradient(135deg, #218838, #1e7e34); 
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); 
        }
        .btn-success.btn-xl:hover { 
            background: linear-gradient(135deg, #28a745, #218838); 
            transform: translateY(-2px); 
            border-color: rgba(255, 255, 255, 0.5); 
        }
        .btn-xl:active { 
            transform: scale(0.98); 
        }

        /* Ticket Receipt */
        .ticket-receipt { 
            background: #ffffff; 
            color: #1a3d7c; 
            border: none; 
            border-radius: var(--radius-md); 
            position: relative; 
            padding: 20px; 
            margin: 20px 0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        .ticket-label-large { 
            font-size: clamp(2rem, 10vw, 3.5rem); 
            font-weight: 900; 
            color: #1a3d7c; 
            letter-spacing: 2px; 
            word-break: break-all;
        }

        /* Gold divider */
        .gold-divider { 
            width: 70px; 
            border-top: 4px solid #ffd700; 
            margin: 15px auto; 
            border-radius: 10px; 
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4); 
        }

        /* Adjust text colors for dark background */
        .text-muted { 
            color: #adb5bd !important; 
        }
        .btn-link.text-muted { 
            color: #ced4da !important; 
        }
        .btn-link.text-muted:hover { 
            color: #ffffff !important; 
            text-decoration: none; 
        }

        /* Ensure images inside popup are responsive */
        .popup-box img {
            max-width: 100%;
            height: auto;
        }

        /* Prevent horizontal scroll */
        .container {
            max-width: 100%;
            overflow-x: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card main-container-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="/res/PSA.png" alt="PSA Logo" class="psa-logo">
                <h1 class="font-weight-bold text-white mb-2">Queue Ticketing System</h1>
                <p class="lead font-weight-bold text-white">How can we help you today?</p>
                <div class="gold-divider"></div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-5 mb-4">
                    <div class="card service-card text-center py-3" onclick="openSelection('national')">
                        <div class="card-body">
                            <i class="fas fa-id-card icon-national"></i>
                            <h4 class="font-weight-bold mt-2">National ID</h4>
                            <p class="text-muted small mb-0">PhilSys Registration & Updates</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-5 mb-4">
                    <div class="card service-card text-center py-3" onclick="openSelection('civil')">
                        <div class="card-body">
                            <i class="fas fa-file-alt icon-civil"></i>
                            <h4 class="font-weight-bold mt-2">Civil Registration</h4>
                            <p class="text-muted small mb-0">Marriage & Death Certs</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="selectionOverlay" class="popup-overlay">
    <div class="popup-box text-center">
        <h2 class="font-weight-bold text-white mb-3">Select Category</h2>
        <button class="btn btn-primary btn-xl btn-block mb-3" onclick="requestTicket(false)">
            <i class="fas fa-user mr-2"></i> REGULAR 
        </button>
        <button class="btn btn-success btn-xl btn-block mb-3" onclick="requestTicket(true)">
            <i class="fas fa-wheelchair mr-2"></i> PRIORITY
        </button>
        <p class="small text-muted mb-3">Note: Priority lanes are for Pregnant Women, PWD, and Senior Citizens.</p>
        <button class="btn btn-link text-muted" onclick="closeAll()">Cancel</button>
    </div>
</div>

<div id="resultOverlay" class="popup-overlay">
    <div class="popup-box text-center">
        <div id="resultContent"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="kiosk.js"></script>

</body>
</html>
