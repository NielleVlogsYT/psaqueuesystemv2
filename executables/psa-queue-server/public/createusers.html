<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Queuing - Create User</title>
    <link rel="icon" type="image/png" href="./res/PSA.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-blue-hover: #2563eb;
            --glass-bg: rgba(25, 30, 45, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --input-bg: rgba(15, 23, 42, 0.4);
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            /* Added a dark overlay to the background image so the form pops out more */
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.5)), 
                        url('./res/Philippine-Statistics-Authority-PSA.png') center / cover fixed;
            color: var(--text-main);  
            animation: fadeIn 0.6s ease-in-out forwards; 
        }
        
        @keyframes fadeIn { 
            0% { opacity: 0; } 
            100% { opacity: 1; } 
        }

        @media (prefers-reduced-motion: no-preference) { 
            @view-transition { navigation: auto; } 
        }
        
        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            z-index: 2;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        /* --- GLASSMORPHISM CARD --- */
        .glass-card { 
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(255, 255, 255, 0.02); 
            position: relative; 
        }

        /* --- FORM LAYOUT --- */
        .input-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }

        .input-group { 
            flex: 1; 
            text-align: left; 
            margin-bottom: 20px; 
        }

        .input-row .input-group { 
            margin-bottom: 0; 
        }
        
        .input-label { 
            display: block; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            margin-left: 5px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .input-wrapper { 
            position: relative; 
        }

        .input-wrapper i { 
            position: absolute; 
            left: 16px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: rgba(255, 255, 255, 0.5); 
            font-size: 1rem; 
            z-index: 5;
            transition: color 0.3s ease;
        }
        
        /* --- INPUT FIELDS --- */
        .input-group input, 
        .input-group select { 
            width: 100%; 
            padding: 14px 15px 14px 45px; 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            font-size: 0.95rem; 
            font-family: inherit; 
            transition: all 0.3s ease; 
            background: var(--input-bg); 
            color: #ffffff;
        }
        
        .input-group input:focus, 
        .input-group select:focus { 
            border-color: var(--primary-blue); 
            outline: none; 
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .input-group input:focus + i {
            color: var(--primary-blue);
        }

        .input-group input::placeholder { 
            color: rgba(255, 255, 255, 0.3); 
        }

        .input-group select option { 
            background: #1e293b; 
            color: white; 
        }
        
        /* --- BUTTONS --- */
        .btn-primary { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary-blue); 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.05rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-primary:hover { 
            background: var(--primary-blue-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .btn-back:hover { 
            color: #ffffff; 
        }

        .btn-back i { 
            margin-right: 8px; 
        }

        /* --- UTILITIES & MODAL --- */
        .status-msg { 
            color: var(--error-color); 
            font-size: 0.9rem; 
            margin-top: 15px; 
            font-weight: 600; 
            text-align: center;
        }

        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(8px); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }

        .modal-overlay.active { 
            display: flex; 
        }

        .modal-content { 
            background: #1e293b; 
            border-radius: 20px; 
            padding: 40px 30px; 
            max-width: 450px; 
            width: 90%; 
            border: 1px solid var(--glass-border); 
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            color: var(--success-color);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .modal-content strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Create Account</h1>
            <p>Register a new staff or system admin</p>
        </div>

        <div class="glass-card">
            <form id="createUserForm">
                
                <div class="input-row">
                    <div class="input-group" style="flex: 2;">
                        <label class="input-label">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fName" required placeholder="First Name">
                        </div>
                    </div>
                    <div class="input-group" style="flex: 2;">
                        <label class="input-label">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lName" required placeholder="Last Name">
                        </div>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label class="input-label">M.I.</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="mInitial" maxlength="2" placeholder="e.g. A">
                        </div>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label class="input-label">Employee ID</label>
                        <div class="input-wrapper">
                            <i class="fas fa-hashtag"></i>
                            <input type="text" id="empId" required placeholder="Employee ID Number">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">System Role</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user-shield"></i>
                            <select id="userRole">
                                <option value="controller">Queue Staff</option>
                                <option value="admin">System Admin</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Account Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="userEmail" required placeholder="company.email@example.com">
                    </div>
                </div>

                <button type="submit" id="btnCreate" class="btn-primary">Create Account</button>
                <div id="statusMsg" class="status-msg"></div>
            </form>
            
            <div style="text-align: center;">
                <a href="admin_dashboard.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Return to Admin Dashboard
                </a>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <h2>User Created!</h2>
            <p>
                Account successfully registered. A temporary password has been generated and securely emailed to the user at <strong id="sentEmailAddress"></strong>.
            </p>
            
            <button id="btnCopyClose" class="btn-primary" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); box-shadow: none;">
                Close Window
            </button>
        </div>
    </div>

    <script type="module">
        const appConfig = await fetch('/api/config').then(res => res.json()).catch(() => ({ localMode: false }));
        let createUserWithEmailAndPassword = null;
        let signOut = null;
        let secondaryAuth = null;

        // Security check: Ensure the person viewing this is actually logged in as admin
        if(localStorage.getItem('psa_role') !== 'admin') {
            alert("Unauthorized Access. Redirecting to login.");
            window.location.href = "login.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBv0Bnx7ESj_roRTB137vWJ7KLTDXR1C8Y",
            authDomain: "queue-project-login.firebaseapp.com",
            projectId: "queue-project-login",
            storageBucket: "queue-project-login.firebasestorage.app",
            messagingSenderId: "869956656004",
            appId: "1:869956656004:web:3d2a98bea880c701605bd1"
        };

        if (appConfig.localMode) {
            document.title = `${appConfig.systemName || 'PSA Queuing'} - Create User`;
        } else {
            const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js");
            const firebaseAuth = await import("https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js");
            firebaseApp.initializeApp(firebaseConfig);
            const secondaryApp = firebaseApp.initializeApp(firebaseConfig, "UserCreationInstance");
            secondaryAuth = firebaseAuth.getAuth(secondaryApp);
            createUserWithEmailAndPassword = firebaseAuth.createUserWithEmailAndPassword;
            signOut = firebaseAuth.signOut;
        }

        // Helper to generate a complex temporary password meeting your system's criteria
        function generateTempPassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let pass = "";
            pass += "A"; pass += "a"; pass += "1"; pass += "!";
            for(let i=0; i<6; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return pass.split('').sort(() => 0.5 - Math.random()).join('');
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnCreate');
            const status = document.getElementById('statusMsg');
            
            const fName = document.getElementById('fName').value.trim();
            const lName = document.getElementById('lName').value.trim();
            const mInitial = document.getElementById('mInitial').value.trim();
            const empId = document.getElementById('empId').value.trim();
            const role = document.getElementById('userRole').value;
            const email = document.getElementById('userEmail').value.trim();

            if(!fName || !lName || !empId || !email) {
                status.innerText = "Please fill in all required fields.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Validating details...";
            status.innerText = "";

            try {
                // PRE-FLIGHT CHECK: Verify if Email or Employee ID already exists in MongoDB
                const checkRes = await fetch('/api/check-user-exists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, employeeId: empId })
                });
                
                const checkData = await checkRes.json();

                if (checkData.exists) {
                    status.innerText = `Error: An account with this ${checkData.field} already exists.`;
                    btn.disabled = false;
                    btn.innerText = "Create Account";
                    return; // Stop the process here
                }

                btn.innerText = appConfig.localMode ? "Creating local account..." : "Creating account & sending email...";
                const tempPassword = generateTempPassword();

                if (!appConfig.localMode) {
                    // 1. Create account in Firebase using secondaryAuth
                    await createUserWithEmailAndPassword(secondaryAuth, email, tempPassword);
                    
                    // Immediately sign out the newly created user to keep secondaryAuth clean
                    await signOut(secondaryAuth);
                }

                // 2. Save extended profile details & role to your backend database
                await fetch('/api/set-role', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        email: email, 
                        role: role,
                        firstName: fName,
                        lastName: lName,
                        middleInitial: mInitial,
                        employeeId: empId,
                        localPassword: appConfig.localMode ? tempPassword : undefined
                    }) 
                });

                if (!appConfig.localMode) {
                    // 3. Send the Welcome Email to the User
                    await fetch('/api/send-welcome-email', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, tempPassword: tempPassword, firstName: fName }) 
                    });
                }

                // 4. Show Success Modal
                document.getElementById('sentEmailAddress').innerText = email;
                const successMessage = document.querySelector('#successModal p');
                if (successMessage && appConfig.localMode) {
                    successMessage.innerHTML = `Account successfully registered locally for <strong id="sentEmailAddress">${email}</strong>.<br><br>Temporary password: <strong>${tempPassword}</strong>`;
                } else if (successMessage) {
                    successMessage.innerHTML = `Account successfully registered. A temporary password has been generated and securely emailed to the user at <strong id="sentEmailAddress">${email}</strong>.`;
                }
                document.getElementById('successModal').classList.add('active');

                // Reset Form
                document.getElementById('createUserForm').reset();

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    status.innerText = "Error: An account with this Email already exists in Firebase.";
                } else {
                    status.innerText = error.message.replace("Firebase: ", "");
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Create Account";
            }
        });
        
        document.getElementById('btnCopyClose').addEventListener('click', () => {
            document.getElementById('successModal').classList.remove('active');
        });
    </script>
</body>
</html>
